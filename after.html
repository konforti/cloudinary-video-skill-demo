<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costera Playa Azul — Rooms &amp; Suites</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />

    <!-- Cloudinary Video Player, UMD build. This page has no build step, so
         it loads the player as a script and reaches it from js/after.js on
         window.cloudinary. In a bundled app, prefer the ES import. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/cloudinary-video-player/dist/cld-video-player.min.css"
    />
    <script src="https://unpkg.com/cloudinary-video-player/dist/cld-video-player.min.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <span class="brand" data-brand></span>
        <span class="tagline" data-tagline></span>
        <span data-state-badge></span>
      </div>
    </header>

    <main>
      <h1 data-property></h1>
      <p class="lede" data-lede></p>

      <div class="player-row">
        <div class="player-host" data-player></div>
        <aside class="rail" data-rail hidden></aside>
      </div>

      <div class="cart-notice" data-cart hidden></div>

      <section data-transcript hidden></section>

      <section class="grid-section" data-grid-section></section>
      <section class="reviews" data-reviews></section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner" data-footer></div>
    </footer>

    <script type="module" src="js/after.js"></script>
  </body>
</html>
